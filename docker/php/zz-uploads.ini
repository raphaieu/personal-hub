; Uploads em lote (álbuns / Livewire / contribuição). Alinhar com:
; - ALBUMS_MAX_UPLOAD_BYTES e ALBUMS_MAX_FILES_PER_BATCH no .env
; - client_max_body_size no Nginx do container (docker/nginx/default.conf)
; - Se o aaPanel/Nginx do host também faz proxy, aumente client_max_body_size lá.
;
; post_max_size é o tamanho total do corpo multipart: para N arquivos de até X MB,
; precisa ser >= soma dos arquivos + overhead (campos do formulário). Ex.: 120 × 100 MB
; exige ~12G — ajuste conforme o lote real que você aceitar por requisição.

max_file_uploads = 200
upload_max_filesize = 128M
post_max_size = 2048M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
