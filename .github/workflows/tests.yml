name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, sqlite, pdo_sqlite, gd, intl
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes
        run: php artisan test
        env:
          APP_ENV: testing
